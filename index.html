document.documentElement.style.setProperty('--initial-height', window.innerHeight+'px');

</script><script>
(()=>{
const key='student-private-device-v1';
const fields=[...document.querySelectorAll('[data-edit]')];
const photos=[...document.querySelectorAll('[data-photo]')];
fields.forEach(e=>{e.contentEditable='true';e.spellcheck=false});
try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v){fields.forEach((e,i)=>{if(typeof v.text?.[i]==='string')e.textContent=v.text[i]});photos.forEach((e,i)=>{if(v.photos?.[i]?.startsWith('data:image/'))e.src=v.photos[i]})}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify({text:fields.map(e=>e.textContent),photos:photos.map(e=>e.src)}))}catch{}}
fields.forEach(e=>{e.addEventListener('input',save);e.addEventListener('paste',ev=>{ev.preventDefault();const selection=getSelection();if(selection.rangeCount){const range=selection.getRangeAt(0);range.deleteContents();const node=document.createTextNode(ev.clipboardData.getData('text/plain'));range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);save()}})});
let target;const upload=document.querySelector('#upload');photos.forEach(e=>{e.onclick=()=>{target=e;upload.click()};e.onkeydown=ev=>{if(ev.key==='Enter')e.click()}});
upload.onchange=()=>{const f=upload.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{target.src=reader.result;save()};reader.readAsDataURL(f);upload.value=''};
})();
</script><dialog id="setup"><h3>导入本机资料</h3><p>选择随附的“个人信息-仅导入手机.json”，资料只保存到当前手机，不上传。</p><input type="file" id="private-import" accept="application/json,.json"><p><button onclick="document.querySelector('#setup').close()">稍后填写</button></p><p id="import-error"></p></dialog>
<script>
const localKey='student-private-device-v1';
if(!localStorage.getItem(localKey))document.querySelector('#setup').showModal();
document.querySelector('#private-import').onchange=async event=>{try{const f=event.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data.text)||!Array.isArray(data.photos))throw new Error('文件格式不正确');localStorage.setItem(localKey,JSON.stringify(data));location.reload()}catch(e){document.querySelector('#import-error').textContent='导入失败：'+e.message}};
</script></body></html>
